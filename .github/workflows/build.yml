    - name: Build TweakLoader (iOS)
      run: |
        echo "=== Building TweakLoader.dylib for iOS ==="
        
        # 先编译 lv_bypass 为 .o
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=15.0 \
          -fmodules \
          -c \
          -o lv_bypass.o \
          lv_bypass.c
        
        # 再编译 TweakLoader 并链接 lv_bypass.o
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=15.0 \
          -fmodules \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -o TweakLoader_ios.dylib \
          TweakLoader.m \
          lv_bypass.o
        
        if [ $? -eq 0 ]; then
          echo "[✓] Built successfully"
          file TweakLoader_ios.dylib
        else
          echo "[!] Build failed"
          exit 1
        fi
