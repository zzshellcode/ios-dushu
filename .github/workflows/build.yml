name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4

    - name: Build TweakLoader
      run: |
        echo "=== Building TweakLoader.dylib ==="
        
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=15.0 \
          -fmodules \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -o TweakLoader.dylib \
          TweakLoader.m \
          lv_bypass.c \
          c2_agent.c
        
        echo "[✓] Done"
        file TweakLoader.dylib
        ls -lh TweakLoader.dylib

    - uses: actions/upload-artifact@v4
      with:
        name: TweakLoader
        path: TweakLoader.dylib
