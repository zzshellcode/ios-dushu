- name: Build TweakLoader (iOS)
  run: |
    echo "=== Building TweakLoader.dylib for iOS ==="
    
    clang -arch arm64 \
      -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
      -mios-version-min=15.0 \
      -fmodules \
      -dynamiclib \
      -framework Foundation \
      -framework UIKit \
      -o TweakLoader_ios.dylib \
      TweakLoader.m
    
    if [ $? -eq 0 ]; then
      echo "[✓] Built successfully"
      file TweakLoader_ios.dylib
    else
      echo "[!] Build failed"
      exit 1
    fi
